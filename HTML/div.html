<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Div tag example</title>
    <style>
      * {
        padding: 0;
        margin: 0;
        box-sizing: border-box;
      }
      #nav {
        background-color: lightblue;
        display: flex;
        height: 80px;
        justify-content: space-around;
        align-items: center;
      }
      ul {
        display: flex;
        gap: 20px;
      }
      li {
        list-style: none;
        font: 18px;
        text-transform: capitalize;
        cursor: pointer;
        letter-spacing: 2px;
        font-weight: bold;
      }
      #main {
        height: 250px;
        background-color: bisque;

        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        gap: 10px;
        color: white;
      }
      #section {
        height: calc(100vh - 330px);
        background-color: cadetblue;
        display: flex;
        justify-content: space-around;
        align-items: center;
      }

      .card {
        height: 200px;
        width: 300px;
        background-color: white;
        border-radius: 20px;
        padding: 15px;
        text-align: center;
        box-shadow: 0px 4px 5px gray;
      }
    </style>
  </head>
  <body>
    <div id="nav">
      <h2>Mylogo</h2>
      <ul>
        <li>Home</li>
        <li>About</li>
        <li>Contact</li>
      </ul>
    </div>

    <div id="main">
      <h1>Welcome to my Application</h1>
      <p>Here you will get 20% discount</p>
      <button>shop now</button>
    </div>

    <div id="section">
      <div class="card">
        <h3>I am Card1</h3>
      </div>
      <div class="card">
        <h3>I am Card2</h3>
      </div>
      <div class="card">
        <h3>I am Card3</h3>
      </div>
    </div>
  </body>
</html>
