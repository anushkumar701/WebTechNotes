<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Semantic Tag</title>
    <style>
      body {
        color: white;
      }
    </style>
  </head>
  <body bgcolor="black">
    <nav>
      <h1>My logo</h1>
      <ul>
        <li>Home</li>
        <li>Assets</li>
        <li>Contact</li>
      </ul>
    </nav>
    <main>
      <h1>Welcome to Semantic Session</h1>
      <p>
        Here We will get to know how to use Semantic tags in html and what is
        the meaning
      </p>
      <button>Get Started</button>
      <section>
        <figure>
          <img src="./Assets/image.jpg" alt="" height="400" width="600" />
        </figure>
        <figcaption>Image</figcaption>
      </section>
    </main>
    <article>
      <aside>
        <h2>i am left</h2>
      </aside>  
      <aside>
        <h2>I am right</h2>
      </aside>
    </article>
    <footer>
      <details>
        <summary>NB40</summary>
        <p>Hi hello</p>
      </details>
    </footer>
  </body>
</html>
