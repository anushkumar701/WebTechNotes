<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MultiMedia</title>
    <style>
        body{
            color: white;
        }
    </style>
</head>
<body bgcolor="black">
    <h1>Adding The Audio:</h1>
    <audio src="./Assets/audio.mp3" controls loop /*autoplay*\ muted start="0.10"></audio>
    <h1>Adding the Video:</h1>
    <video src="./Assets/video.mp4" controls height="300" width="800" poster="./image.jpg" muted ></video>
    <iframe width="560" height="315" src="https://www.youtube.com/embed/neOasLBWoy0?si=Dtrh9rYu9_He66OK" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
</body>
</html>
