<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Iframe</title>
  </head>
  <body>
    <iframe
      src="https://en.wikipedia.org/wiki/God_of_War_Ragnar%C3%B6k"
      frameborder="1"
      height="800"
      width="900"
    ></iframe>
    <iframe src="image.html" frameborder="0" height="800" width="900"></iframe>
    <h2>How to add map</h2>
    <iframe
      src="https://www.google.com/maps/embed?pb=!1m17!1m12!1m3!1d11372.333434275175!2d79.4913038833392!3d11.760763657480583!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m2!1m1!2s!5e1!3m2!1sen!2sin!4v1780125883044!5m2!1sen!2sin"
      width="600"
      height="450"
      style="border: 0"
      allowfullscreen=""
      loading="lazy"
      referrerpolicy="no-referrer-when-downgrade"
    ></iframe>
    <h2>How to add youtube video</h2>
    <iframe
      width="560"
      height="315"
      src="https://www.youtube.com/embed/FK-PbeHAeCM?si=rW-lgXGJXBU5SNm5"
      title="YouTube video player"
      frameborder="0"
      allow="
        accelerometer;
        autoplay;
        clipboard-write;
        encrypted-media;
        gyroscope;
        picture-in-picture;
        web-share;
      "
      referrerpolicy="strict-origin-when-cross-origin"
      allowfullscreen
    ></iframe>
  </body>
</html>
