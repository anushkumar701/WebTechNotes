<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Marquee Tag</title>
    <style>
      marquee {
        border: 3px solid;
      }
    </style>
  </head>
  <body>
    <marquee behavior="alternate" direction="right" scrollamount="2" loop="">
      <h1>RCB has reached to the finale</h1>
    </marquee>
    <marquee
      behavior="alternate"
      direction="right"
      scrollamount="4.9"
      height=""
      width="500"
    >
      <img
        src="https://media3.giphy.com/media/v1.Y2lkPWVjZjA1ZTQ3czlsb3Q1Z2ZobmRia3V0bmh5dTNoMGI2YzM3bnN3dmJmenh6b3Y5OSZlcD12MV9zdGlja2Vyc19zZWFyY2gmY3Q9cw/L3ts5AtgZydVwhMvjh/200.webp"
        alt=""
      />
    </marquee>
    <marquee behavior="" direction="up" scrollamount="4.9" height="300">
      <img
        src="https://media1.giphy.com/media/v1.Y2lkPWVjZjA1ZTQ3NjRuZTZmN29keDNpNWFmMjk0b2FlYzZuM3Y0bzg2bzd4YjJpeWN3MiZlcD12MV9zdGlja2Vyc19zZWFyY2gmY3Q9cw/si2EZYFwfFCrWzn1zv/giphy.webp"
        alt=""
        height="100"
      />
    </marquee>
    <marquee behavior="" direction="down">
      <img
        src="https://www.google.com/logos/doodles/2026/mens-ipl-2026-semi-final-6753651837111070.2-la22242a.gif"
        alt=""
      />
    </marquee>
  </body>
</html>
