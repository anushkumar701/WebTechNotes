<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="heros.css" />
    <style>
      * {
        padding: 0;
        margin: 0;
        box-sizing: border-box;
      }
      section {
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      #s1 {
        background-image: url(./kratos3.png);
        background-size: cover;
      }
      #s2 {
        background-image: url(./wp2514508-god-of-war-game-wallpapers.jpg);
        background-size: cover;
        background-position: center;
      }
      #s3 {
        background-image: url(./image.jpg);
        background-size: cover;
        background-position: center;
      }
      section > h1 {
        color: white;
        font-size: 80px;
        text-transform: uppercase;
        letter-spacing: 5px;
        text-shadow: 0px 0px 10px black;
      }
      section {
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background-attachment: fixed;
      }

    </style>
  </head>
  <body>
    <section id="s1">
      <h1>Kratos</h1>
    </section>
    <section id="s2">
      <h1>God of War</h1>
    </section>
    <section id="s3">
      <h1>Miss Ayase</h1>
    </section>
  </body>
</html>
