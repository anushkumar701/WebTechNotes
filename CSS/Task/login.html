<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Signup</title>
    <link rel="stylesheet" href="login.css" />
  </head>
  <body>
    <div class="outer">
      <div class="left">
        <div class="hero">
          <h1>Welcome Back!</h1>
          <p>Create your account and start building beautiful experiences.</p>
        </div>
      </div>
      <div class="right">
        <div class="box">
          <h2>Signup Page</h2>
          <form action="" class="login-form">
            <label for="name">Name</label>
            <input
              id="name"
              class="input-field"
              type="text"
              placeholder="Enter your name"
            />

            <label for="password">Password</label>
            <input
              id="password"
              class="input-field"
              type="password"
              placeholder="Enter your password"
            />

            <label for="email">Email</label>
            <input
              id="email"
              class="input-field"
              type="email"
              placeholder="Enter your email"
            />

            <button type="submit" class="btn-submit">Signup</button>
          </form>
          <a href="#" class="alt-link">Already have an account?</a>
        </div>
      </div>
    </div>
  </body>
</html>
